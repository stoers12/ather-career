# Local-only Owner HTTPS bridge. Apply alongside docker-compose.yml; it does
# not alter the production Compose topology or the Owner database service.
services:
  web:
    volumes:
      - ./docker/apache/owner-local-health.conf:/etc/apache2/conf-enabled/owner-local-health.conf:ro

  owner_https:
    image: caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: "no"
    security_opt:
      - no-new-privileges:true
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./docker/Caddyfile.owner-local:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --insecure --resolve localhost:443:127.0.0.1 https://localhost/health.php >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    stop_grace_period: 15s

volumes:
  caddy_data:
