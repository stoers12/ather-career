# Disposable required-gate web containers only (mounted by
# scripts/run-evidence-hub-required-gates.ps1). Never part of any image: it
# exposes the synthetic browser fixtures that live outside the document root.
Alias /tests/phase2/support/ /var/www/app/tests/phase2/support/
<Directory "/var/www/app/tests/phase2/support">
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>
