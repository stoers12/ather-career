name: CI

on:
  push:
  pull_request:

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ github.sha }}
      SESSION_COOKIE_SECURE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax
        run: |
          docker run --rm -v "$PWD:/app:ro" -w /app php:8.3-cli sh -lc 'find . -name "*.php" -not -path "./.git/*" -print0 | xargs -0 -n1 php -l'

      - name: JavaScript syntax
        run: node --check admin.js && node --check portfolio.js

      - name: Phase 2 test foundation
        run: |
          docker run --rm -e APP_ENV=test -e ATHERCAR_TEST_MODE=1 -v "$PWD:/app:ro" -w /app php:8.3-cli php scripts/run-phase2-tests.php

      - name: Configure disposable environment
        run: |
          cp .env.example .env
          sed -i 's/replace_with_local_database_password/ci_database_password/' .env
          sed -i 's/replace_with_local_root_password/ci_root_password/' .env
          sed -i 's/MYSQL_DATABASE=portfolio_db/MYSQL_DATABASE=ather_career_test_ci/' .env
          sed -i 's/SESSION_COOKIE_SECURE=false/SESSION_COOKIE_SECURE=true/' .env
          cat >> .env <<'EOF'
          EXPECTED_OIDC_ISSUER=https://ci-auth.us.auth0.com/
          OIDC_CLIENT_ID=ci_auth0_client_id_123456
          OIDC_CLIENT_SECRET=ci_auth0_client_secret_1234567890
          OIDC_REDIRECT_URI=https://ci.ather-career.invalid/owner_oidc_callback.php
          EOF

      - name: Build and start production-like stack
        run: docker compose -p ather-career-ci -f docker-compose.production.yml up -d --build

      - name: Wait for healthchecks
        run: |
          for _ in $(seq 1 30); do
            db=$(docker inspect -f '{{.State.Health.Status}}' ather-career-ci-db-1 2>/dev/null || true)
            web=$(docker inspect -f '{{.State.Health.Status}}' ather-career-ci-web-1 2>/dev/null || true)
            [ "$db" = healthy ] && [ "$web" = healthy ] && exit 0
            sleep 2
          done
          docker compose -p ather-career-ci -f docker-compose.production.yml logs
          exit 1

      - name: Migration and production security gate
        run: |
          docker compose -p ather-career-ci -f docker-compose.production.yml exec -T -e APP_ENV=test -e ATHERCAR_TEST_MODE=1 web php scripts/run-phase2-ownership-rehearsal.php
          docker compose -p ather-career-ci -f docker-compose.production.yml exec -T -e APP_ENV=test -e ATHERCAR_TEST_MODE=1 web php scripts/run-phase2-tenant-authorization-rehearsal.php
          docker compose -p ather-career-ci -f docker-compose.production.yml exec -T -e APP_ENV=test -e ATHERCAR_TEST_MODE=1 web php scripts/run-phase2-owner-flow-rehearsal.php
          docker compose -p ather-career-ci -f docker-compose.production.yml exec -T -e APP_ENV=test -e ATHERCAR_TEST_MODE=1 web php scripts/run-phase2-public-lifecycle-rehearsal.php
          docker compose -p ather-career-ci -f docker-compose.production.yml exec -T -e APP_ENV=test -e ATHERCAR_TEST_MODE=1 web php scripts/run-phase2-experience-rehearsal.php
          docker compose -p ather-career-ci -f docker-compose.production.yml exec -T web php database/migrate.php
          docker compose -p ather-career-ci -f docker-compose.production.yml exec -T -e APP_ENV=test -e ATHERCAR_TEST_MODE=1 web php scripts/run-phase2-auth0-rehearsal.php
          docker compose -p ather-career-ci -f docker-compose.production.yml exec -T web php scripts/check-production-security.php

      - name: HTTP smoke test
        run: |
          curl --fail --retry 10 --retry-connrefused http://127.0.0.1:8098/health.php | grep -x OK
          curl --fail http://127.0.0.1:8098/ready.php | grep -x READY
          curl --fail http://127.0.0.1:8098/
          curl --fail http://127.0.0.1:8098/owner_login.php
          for route in /admin.php /login.php /logout.php /personal_info.php /projects.php /messages.php /api/projects.php; do test "$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8098${route}")" = 404; done
          curl --fail http://127.0.0.1:8098/p/a-public
          curl --fail http://127.0.0.1:8098/p/a-public/projects.json
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8098/api/projects.php)" = 404

      - name: Cleanup
        if: always()
        run: docker compose -p ather-career-ci -f docker-compose.production.yml down -v --remove-orphans
