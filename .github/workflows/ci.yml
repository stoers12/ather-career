name: CI

on:
  push:
  pull_request:

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ github.sha }}
      SESSION_COOKIE_SECURE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax
        run: |
          docker run --rm -v "$PWD:/app:ro" -w /app php:8.3-cli sh -lc 'find . -name "*.php" -not -path "./.git/*" -print0 | xargs -0 -n1 php -l'

      - name: Configure disposable environment
        run: |
          cp .env.example .env
          sed -i 's/replace_with_local_database_password/ci_database_password/' .env
          sed -i 's/replace_with_local_root_password/ci_root_password/' .env
          sed -i 's/replace_with_admin_username/ci_admin/' .env
          sed -i 's/replace_with_password_hash/ci_not_a_real_password_hash/' .env
          sed -i 's/SESSION_COOKIE_SECURE=false/SESSION_COOKIE_SECURE=true/' .env

      - name: Build and start production-like stack
        run: docker compose -p ather-career-ci -f docker-compose.production.yml up -d --build

      - name: Wait for healthchecks
        run: |
          for _ in $(seq 1 30); do
            db=$(docker inspect -f '{{.State.Health.Status}}' ather-career-ci-db-1 2>/dev/null || true)
            web=$(docker inspect -f '{{.State.Health.Status}}' ather-career-ci-web-1 2>/dev/null || true)
            [ "$db" = healthy ] && [ "$web" = healthy ] && exit 0
            sleep 2
          done
          docker compose -p ather-career-ci -f docker-compose.production.yml logs
          exit 1

      - name: Migration and production security gate
        run: |
          docker compose -p ather-career-ci -f docker-compose.production.yml exec -T web php database/migrate.php
          docker compose -p ather-career-ci -f docker-compose.production.yml exec -T web php database/migrate.php
          docker compose -p ather-career-ci -f docker-compose.production.yml exec -T web php scripts/check-production-security.php

      - name: HTTP smoke test
        run: |
          curl --fail --retry 10 --retry-connrefused http://127.0.0.1:8098/health.php | grep -x OK
          curl --fail http://127.0.0.1:8098/
          curl --fail http://127.0.0.1:8098/login.php
          curl --fail http://127.0.0.1:8098/api/projects.php
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8098/api/projects.php)" = 405

      - name: Cleanup
        if: always()
        run: docker compose -p ather-career-ci -f docker-compose.production.yml down -v --remove-orphans
