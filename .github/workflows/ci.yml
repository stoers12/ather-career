name: CI

on:
  push:
  pull_request:

jobs:
  release-script-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release script safety (no Docker)
        shell: pwsh
        run: ./tests/Integration/test-release-local.ps1

  phpunit-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the development image with PCOV
        run: |
          docker build --target development -t ather-career-ci-dev:${{ github.sha }} .
          docker build -f docker/phpunit-coverage.Dockerfile --build-arg BASE_IMAGE=ather-career-ci-dev:${{ github.sha }} -t ather-career-ci-coverage:${{ github.sha }} docker
      - name: PHPUnit and self-contained runners with line coverage
        run: |
          mkdir -p coverage/raw && chmod -R 0777 coverage
          php() {
            docker run --rm --network none --entrypoint php -e APP_ENV=test -e ATHERCAR_TEST_MODE=1 -e PHASE2_COVERAGE_DIR=/coverage/raw \
              -v "$PWD/coverage:/coverage" -w /var/www/app ather-career-ci-coverage:${{ github.sha }} \
              -d pcov.enabled=1 -d pcov.directory=/var/www/app -d memory_limit=2G "$@"
          }
          php vendor/bin/phpunit --do-not-cache-result --coverage-php /coverage/raw/phpunit.cov
          # Runners that need no database or network; the rest are covered by the
          # orchestrated jobs below but are not yet counted (docs/PHASE2_TESTING.md).
          for runner in account-entry onboarding-editor onboarding-presentation owner-logout \
                        owner-readiness-claim owner-readiness-session recovery-presentation signin; do
            php -d auto_prepend_file=/var/www/app/tests/Support/collect-process.php "tests/Integration/run-${runner}-tests.php"
          done
          php vendor/bin/phpcov merge --clover /coverage/clover.xml --text /coverage/summary.txt /coverage/raw
          cat coverage/summary.txt | head -n 12
      - uses: actions/upload-artifact@v4
        with:
          name: phpunit-coverage
          path: coverage/

  production-smoke:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ github.sha }}
      PORTFOLIO_PRODUCTION_IMAGE: ather-career-ci-web:${{ github.sha }}
      MYSQL_DATABASE: ather_career_test_ci
      MYSQL_USER: portfolio_user
      MYSQL_PASSWORD: ci_database_password
      MYSQL_ROOT_PASSWORD: ci_root_password
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ather_career_test_ci
      DB_USER: portfolio_user
      DB_PASSWORD: ci_database_password
      PUBLIC_BASE_URL: https://localhost:8443
      SESSION_COOKIE_SECURE: "true"
      EXPECTED_OIDC_ISSUER: https://127.0.0.1:9443/
      PRESERVED_V1_OIDC_SUBJECT: synthetic-preserved-owner
      OIDC_CLIENT_ID: ci_auth0_client_id_123456
      OIDC_CLIENT_SECRET: ci_auth0_client_secret_1234567890
      OIDC_REDIRECT_URI: https://ci.ather-career.invalid/owner_oidc_callback.php
      EVIDENCE_HUB_OPAQUE_TARGET_HMAC_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      COMPOSE_DISABLE_ENV_FILE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax
        run: |
          docker run --rm -v "$PWD:/app:ro" -w /app php:8.3-cli sh -lc 'find . -name "*.php" -not -path "./.git/*" -print0 | xargs -0 -n1 php -l'

      - name: Static analysis
        run: |
          docker run --rm -v "$PWD:/app" -w /app composer:2 sh -ec 'composer install --no-interaction --prefer-dist && composer analyse'

      - name: JavaScript syntax
        run: git ls-files -z '*.js' '*.mjs' '*.cjs' | xargs -0 -n1 node --check

      - name: Validate production Compose configuration
        run: docker compose -p ather-career-ci -f docker-compose.production.yml config --quiet

      - name: Verify pinned final-profile catalog
        run: python3 scripts/tools/build-profile-catalog.py --check

      - name: Build production PHP image
        run: docker compose -p ather-career-ci -f docker-compose.production.yml build web

      - name: Verify OIDC issuer CSP startup guard in Apache and Caddy
        run: |
          docker run --rm --entrypoint /bin/sh -v "$PWD/tests/Integration/test-oidc-issuer-guard.sh:/test-oidc-issuer-guard.sh:ro" "$PORTFOLIO_PRODUCTION_IMAGE" /test-oidc-issuer-guard.sh /usr/local/bin/validate-oidc-issuer.sh
          docker run --rm --entrypoint /bin/sh -v "$PWD/tests/Integration/test-oidc-issuer-guard.sh:/test-oidc-issuer-guard.sh:ro" -v "$PWD/docker/validate-oidc-issuer.sh:/etc/caddy/validate-oidc-issuer.sh:ro" caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648 /test-oidc-issuer-guard.sh /etc/caddy/validate-oidc-issuer.sh

      - name: Verify PHP and libvips dependencies
        run: |
          docker run --rm --entrypoint php "$PORTFOLIO_PRODUCTION_IMAGE" -r 'foreach (["gd", "intl", "mbstring"] as $extension) { if (!extension_loaded($extension)) { fwrite(STDERR, "$extension missing\n"); exit(1); } } if (!class_exists("Normalizer") || !function_exists("grapheme_strlen") || !function_exists("mb_strlen")) { fwrite(STDERR, "Unicode support missing\n"); exit(1); }'
          docker run --rm --entrypoint sh "$PORTFOLIO_PRODUCTION_IMAGE" -c 'test -x /usr/bin/vips && /usr/bin/vips --version'

      - name: Phase 2 test foundation
        run: |
          docker run --rm --entrypoint php -e APP_ENV=test -e ATHERCAR_TEST_MODE=1 -v "$PWD:/workspace:ro" -w /workspace "$PORTFOLIO_PRODUCTION_IMAGE" scripts/run-phase2-tests.php
          docker run --rm --entrypoint php -e APP_ENV=test -e ATHERCAR_TEST_MODE=1 -v "$PWD:/workspace:ro" -w /workspace "$PORTFOLIO_PRODUCTION_IMAGE" vendor/bin/phpunit --do-not-cache-result
          docker run --rm --entrypoint php -e APP_ENV=test -e ATHERCAR_TEST_MODE=1 -v "$PWD:/workspace:ro" -w /workspace "$PORTFOLIO_PRODUCTION_IMAGE" tests/Integration/run-signin-tests.php
          docker run --rm --entrypoint php -e APP_ENV=test -e ATHERCAR_TEST_MODE=1 -v "$PWD:/workspace:ro" -w /workspace "$PORTFOLIO_PRODUCTION_IMAGE" tests/Integration/run-owner-readiness-claim-tests.php
          docker run --rm --entrypoint php -e APP_ENV=test -e ATHERCAR_TEST_MODE=1 -v "$PWD:/workspace:ro" -w /workspace "$PORTFOLIO_PRODUCTION_IMAGE" tests/Integration/run-owner-readiness-session-tests.php
          docker run --rm --entrypoint php -e APP_ENV=test -e ATHERCAR_TEST_MODE=1 -v "$PWD:/workspace:ro" -w /workspace "$PORTFOLIO_PRODUCTION_IMAGE" tests/Integration/run-owner-logout-tests.php
          docker run --rm --entrypoint php -v "$PWD:/workspace:ro" -w /workspace "$PORTFOLIO_PRODUCTION_IMAGE" tests/Integration/run-account-entry-tests.php
          docker run --rm --entrypoint php -v "$PWD:/workspace:ro" -w /workspace "$PORTFOLIO_PRODUCTION_IMAGE" tests/Integration/run-recovery-presentation-tests.php
          docker run --rm --entrypoint php -v "$PWD:/workspace:ro" -w /workspace "$PORTFOLIO_PRODUCTION_IMAGE" tests/Integration/run-onboarding-presentation-tests.php

      - name: Start isolated CI database
        run: docker compose -p ather-career-ci -f docker-compose.production.yml up -d --no-build db

      - name: Wait for isolated CI database health
        run: |
          for _ in $(seq 1 60); do
            db=$(docker inspect -f '{{.State.Health.Status}}' ather-career-ci-db-1 2>/dev/null || true)
            [ "$db" = healthy ] && exit 0
            sleep 2
          done
          echo 'Isolated CI database did not become healthy.' >&2
          exit 1

      - name: Owner readiness creation route
        run: |
          docker compose -p ather-career-ci -f docker-compose.production.yml run --rm --no-deps --entrypoint php \
            -e APP_ENV=test -e ATHERCAR_TEST_MODE=1 -e ATHERCAR_TEST_DB_HOST=db -e DB_PORT=3306 \
            -e "ATHERCAR_TEST_DB_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD" \
            web tests/Integration/run-owner-readiness-creation-route-tests.php

      - name: Create fresh V1 rehearsal database
        run: |
          set -euo pipefail
          REHEARSAL_DB_NAME="ather_career_test_$(openssl rand -hex 12)"
          [[ "$REHEARSAL_DB_NAME" =~ ^ather_career_test_[a-f0-9]{24}$ ]] || { echo 'Invalid rehearsal database name.' >&2; exit 1; }
          [[ "$MYSQL_USER" =~ ^[a-z_][a-z0-9_]{0,31}$ ]] || { echo 'Invalid CI database username.' >&2; exit 1; }
          echo "REHEARSAL_DB_NAME=$REHEARSAL_DB_NAME" >> "$GITHUB_ENV"
          docker exec ather-career-ci-db-1 sh -ec '
            umask 077
            printf "[client]\nuser=root\npassword=%s\n" "$MYSQL_ROOT_PASSWORD" > /tmp/ather-career-ci-mysql.cnf
            chmod 0600 /tmp/ather-career-ci-mysql.cnf
          '
          docker exec ather-career-ci-db-1 mysql --defaults-extra-file=/tmp/ather-career-ci-mysql.cnf -e "CREATE DATABASE \`$REHEARSAL_DB_NAME\` CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci; GRANT ALL PRIVILEGES ON \`$REHEARSAL_DB_NAME\`.* TO '$MYSQL_USER'@'%';"
          docker exec -i ather-career-ci-db-1 sh -c 'mysql --defaults-extra-file=/tmp/ather-career-ci-mysql.cnf "$1" < /docker-entrypoint-initdb.d/01-portfolio.sql' sh "$REHEARSAL_DB_NAME"
          tables=$(docker exec ather-career-ci-db-1 mysql --defaults-extra-file=/tmp/ather-career-ci-mysql.cnf -N -B -e "SELECT GROUP_CONCAT(TABLE_NAME ORDER BY TABLE_NAME) FROM information_schema.TABLES WHERE TABLE_SCHEMA = '$REHEARSAL_DB_NAME';")
          test "$tables" = 'messages,personal_info,projects,skills' || { echo 'Rehearsal database is not a fresh V1 baseline.' >&2; exit 1; }

      - name: Run isolated CLI rehearsals
        run: |
          set -euo pipefail
          [[ "$REHEARSAL_DB_NAME" =~ ^ather_career_test_[a-f0-9]{24}$ ]] || { echo 'Invalid rehearsal database name.' >&2; exit 1; }
          rehearse() {
            local output exit_code
            if output=$(docker compose -p ather-career-ci -f docker-compose.production.yml run --rm --no-deps --entrypoint php \
              -e APP_ENV=test -e ATHERCAR_TEST_MODE=1 -e DB_HOST=db -e DB_PORT=3306 \
              -e "DB_NAME=$REHEARSAL_DB_NAME" -e "ATHERCAR_TEST_DB_NAME=$REHEARSAL_DB_NAME" \
              -e DB_USER -e DB_PASSWORD web "$1" 2>&1); then
              printf '%s\n' "$output" | grep '^PASS ' || true
            else
              exit_code=$?
              printf 'Rehearsal %s failed with exit code %s.\n' "$1" "$exit_code" >&2
              printf '%s\n' "$output" |
                sed -E \
                  -e "s/$DB_PASSWORD/[REDACTED]/g" \
                  -e "s/$MYSQL_ROOT_PASSWORD/[REDACTED]/g" \
                  -e "s/$OIDC_CLIENT_SECRET/[REDACTED]/g" \
                  -e "s/$PRESERVED_V1_OIDC_SUBJECT/[REDACTED]/g" \
                  -e "s/Duplicate entry '[^']*'/Duplicate entry '[REDACTED]'/g" \
                  -e 's/(subject|state|nonce|cookie|password|secret)[[:space:]_]*[=:][[:space:]]*[^[:space:],;]+/\1=[REDACTED]/Ig' |
                tail -n 40 >&2
              return "$exit_code"
            fi
          }
          rehearse tests/Integration/run-phase2-ownership-rehearsal.php
          ledger=$(docker exec ather-career-ci-db-1 mysql --defaults-extra-file=/tmp/ather-career-ci-mysql.cnf -N -B -e "SELECT GROUP_CONCAT(version ORDER BY version SEPARATOR ',') FROM \`$REHEARSAL_DB_NAME\`.schema_migrations;")
          test "$ledger" = '001,002,003,004' || { echo 'Ownership rehearsal migration ledger is not exactly 001–004.' >&2; exit 1; }
          echo 'PASS ownership migration checkpoint 001–004'
          rehearse tests/Integration/run-phase2-public-lifecycle-rehearsal.php
          expected=$(find database/migrations -maxdepth 1 -type f -name '[0-9][0-9][0-9]_*.sql' -printf '%f\n' | sed 's/_.*//' | sort | paste -sd, -)
          [[ "$expected" =~ ^[0-9]{3}(,[0-9]{3})*$ ]] || { echo 'Checked-in migration list is invalid.' >&2; exit 1; }
          ledger=$(docker exec ather-career-ci-db-1 mysql --defaults-extra-file=/tmp/ather-career-ci-mysql.cnf -N -B -e "SELECT GROUP_CONCAT(version ORDER BY version SEPARATOR ',') FROM \`$REHEARSAL_DB_NAME\`.schema_migrations;")
          test "$ledger" = "$expected" || { echo 'Public lifecycle rehearsal did not reach the complete checked-in migration ledger.' >&2; exit 1; }
          for required in 006 010 012 015 016 017 018 019 020 021 022; do
            [[ ",$ledger," == *",$required,"* ]] || { echo "Required migration $required is missing." >&2; exit 1; }
          done
          columns=$(docker exec ather-career-ci-db-1 mysql --defaults-extra-file=/tmp/ather-career-ci-mysql.cnf -N -B -e "SELECT GROUP_CONCAT(COLUMN_NAME ORDER BY COLUMN_NAME SEPARATOR ',') FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = '$REHEARSAL_DB_NAME' AND TABLE_NAME = 'projects' AND COLUMN_NAME IN ('technologies', 'problem_statement', 'personal_role', 'measurable_outcome');")
          test "$columns" = 'measurable_outcome,personal_role,problem_statement,technologies' || { echo 'Required project technology or evidence columns are missing.' >&2; exit 1; }
          echo 'PASS complete migration ledger and required project columns'
          rehearse tests/Integration/run-phase2-tenant-authorization-rehearsal.php
          rehearse tests/Integration/run-phase2-experience-rehearsal.php
          rehearse tests/Integration/run-phase2-auth0-rehearsal.php
          # Give this registration rehearsal a generated, database-scoped user.
          REGISTRATION_DB_USER="reg_$(openssl rand -hex 8)"
          REGISTRATION_DB_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$REGISTRATION_DB_PASSWORD"
          echo "REGISTRATION_DB_USER=$REGISTRATION_DB_USER" >> "$GITHUB_ENV"
          cleanup_registration_user() {
            [[ "$REGISTRATION_DB_USER" =~ ^reg_[a-f0-9]{16}$ ]] || return 1
            docker exec ather-career-ci-db-1 mysql --defaults-extra-file=/tmp/ather-career-ci-mysql.cnf \
              -e "DROP USER IF EXISTS '$REGISTRATION_DB_USER'@'%';"
          }
          trap cleanup_registration_user EXIT
          docker exec ather-career-ci-db-1 mysql --defaults-extra-file=/tmp/ather-career-ci-mysql.cnf \
            -e "CREATE USER '$REGISTRATION_DB_USER'@'%' IDENTIFIED BY '$REGISTRATION_DB_PASSWORD'; GRANT ALL PRIVILEGES ON \`$REHEARSAL_DB_NAME\`.* TO '$REGISTRATION_DB_USER'@'%';"
          DB_USER="$REGISTRATION_DB_USER" DB_PASSWORD="$REGISTRATION_DB_PASSWORD" rehearse tests/Integration/run-profile-version-tests.php
          DB_USER="$REGISTRATION_DB_USER" DB_PASSWORD="$REGISTRATION_DB_PASSWORD" rehearse tests/Integration/run-profile-version-route-tests.php
          DB_USER="$REGISTRATION_DB_USER" DB_PASSWORD="$REGISTRATION_DB_PASSWORD" rehearse tests/Integration/run-final-profile-tests.php
          DB_USER="$REGISTRATION_DB_USER" DB_PASSWORD="$REGISTRATION_DB_PASSWORD" rehearse tests/Integration/run-final-profile-route-tests.php
          # The 017 upgrade fixture needs version-1 rows before owner-flow edits them.
          rehearse tests/Integration/run-phase2-owner-flow-rehearsal.php
          DB_USER="$REGISTRATION_DB_USER" DB_PASSWORD="$REGISTRATION_DB_PASSWORD" rehearse tests/Integration/run-registration-core-rehearsal.php
          DB_USER="$REGISTRATION_DB_USER" DB_PASSWORD="$REGISTRATION_DB_PASSWORD" rehearse tests/Integration/run-onboarding-attestation-tests.php
          # Draft suites cover current Profile catalogs and historical exact-retry compatibility.
          DB_USER="$REGISTRATION_DB_USER" DB_PASSWORD="$REGISTRATION_DB_PASSWORD" rehearse tests/Integration/run-onboarding-draft-tests.php
          DB_USER="$REGISTRATION_DB_USER" DB_PASSWORD="$REGISTRATION_DB_PASSWORD" rehearse tests/Integration/run-onboarding-draft-route-tests.php
          DB_USER="$REGISTRATION_DB_USER" DB_PASSWORD="$REGISTRATION_DB_PASSWORD" rehearse tests/Integration/run-onboarding-editor-tests.php
          DB_USER="$REGISTRATION_DB_USER" DB_PASSWORD="$REGISTRATION_DB_PASSWORD" rehearse tests/Integration/run-onboarding-presentation-tests.php
          DB_USER="$REGISTRATION_DB_USER" DB_PASSWORD="$REGISTRATION_DB_PASSWORD" rehearse tests/Integration/run-registration-routing-tests.php

          # Completion owns its transaction; production policies stay unavailable.
          DB_USER="$REGISTRATION_DB_USER" DB_PASSWORD="$REGISTRATION_DB_PASSWORD" rehearse tests/Integration/run-onboarding-completion-tests.php

          # Private HTTP fixture copies supply synthetic documents; production stays null/off.
          DB_USER="$REGISTRATION_DB_USER" DB_PASSWORD="$REGISTRATION_DB_PASSWORD" rehearse tests/Integration/run-onboarding-attestation-route-tests.php
          DB_USER="$REGISTRATION_DB_USER" DB_PASSWORD="$REGISTRATION_DB_PASSWORD" rehearse tests/Integration/run-onboarding-completion-route-tests.php

          # Routing and D1 entry tests use guarded synthetic cohorts and preserve the frozen set.
          DB_USER="$REGISTRATION_DB_USER" DB_PASSWORD="$REGISTRATION_DB_PASSWORD" rehearse tests/Integration/run-owner-journey-route-tests.php

          # Current publication authorization, owned transactions and real HTTP
          # interleavings use isolated synthetic owners and verify full cleanup.
          DB_USER="$REGISTRATION_DB_USER" DB_PASSWORD="$REGISTRATION_DB_PASSWORD" rehearse tests/Integration/run-publication-mutation-tests.php
          DB_USER="$REGISTRATION_DB_USER" DB_PASSWORD="$REGISTRATION_DB_PASSWORD" rehearse tests/Integration/run-project-publication-tests.php
          # Per-type visibility migration, current Profile CAS and public projection.
          DB_USER="$REGISTRATION_DB_USER" DB_PASSWORD="$REGISTRATION_DB_PASSWORD" rehearse tests/Integration/run-contact-visibility-tests.php

      - name: Authenticated draft editor browser checks
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/ather-editor-tools" --no-audit --no-fund playwright@1.58.0
          "$RUNNER_TEMP/ather-editor-tools/node_modules/.bin/playwright" install --with-deps chromium
          EDITOR_DB_USER="editor_$(openssl rand -hex 8)"
          EDITOR_DB_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$EDITOR_DB_PASSWORD"
          EDITOR_EVIDENCE="$RUNNER_TEMP/ather-editor-evidence"
          mkdir -m 0700 "$EDITOR_EVIDENCE"
          cleanup_editor() {
            touch "$EDITOR_EVIDENCE/stop"
            if docker inspect ather-career-ci-editor >/dev/null 2>&1; then
              docker logs ather-career-ci-editor || true
              docker rm -f -v ather-career-ci-editor
            fi
            docker exec ather-career-ci-db-1 mysql --defaults-extra-file=/tmp/ather-career-ci-mysql.cnf -e "DROP USER IF EXISTS '$EDITOR_DB_USER'@'%';"
            rm -f "$EDITOR_EVIDENCE/private-context.json" "$EDITOR_EVIDENCE/stop"
          }
          trap cleanup_editor EXIT
          docker exec ather-career-ci-db-1 mysql --defaults-extra-file=/tmp/ather-career-ci-mysql.cnf -e "CREATE USER '$EDITOR_DB_USER'@'%' IDENTIFIED BY '$EDITOR_DB_PASSWORD'; GRANT ALL PRIVILEGES ON \`$REHEARSAL_DB_NAME\`.* TO '$EDITOR_DB_USER'@'%';"
          docker compose -p ather-career-ci -f docker-compose.production.yml run -d --no-deps --name ather-career-ci-editor --entrypoint php \
            -p 127.0.0.1:8099:8080 -p 127.0.0.1:8100:8081 -v "$EDITOR_EVIDENCE:/evidence" \
            -e APP_ENV=test -e ATHERCAR_TEST_MODE=1 -e "DB_NAME=$REHEARSAL_DB_NAME" -e "ATHERCAR_TEST_DB_NAME=$REHEARSAL_DB_NAME" \
            -e "DB_USER=$EDITOR_DB_USER" -e "DB_PASSWORD=$EDITOR_DB_PASSWORD" -e ATHERCAR_EDITOR_EVIDENCE_DIR=/evidence \
            web tests/Browser/run-onboarding-editor-browser-fixture.php
          for _ in $(seq 1 120); do test -f "$EDITOR_EVIDENCE/private-context.json" && break; sleep 1; done
          test -f "$EDITOR_EVIDENCE/private-context.json"
          APP_ENV=test ATHERCAR_TEST_MODE=1 \
            ATHERCAR_PLAYWRIGHT_MODULE="$RUNNER_TEMP/ather-editor-tools/node_modules/playwright" \
            ATHERCAR_EDITOR_BASE_URL=http://127.0.0.1:8099 ATHERCAR_EDITOR_OFF_URL=http://127.0.0.1:8100 \
            ATHERCAR_EDITOR_CONTAINER=ather-career-ci-editor ATHERCAR_EDITOR_APP_ROOT=/var/www/app \
            ATHERCAR_EDITOR_EVIDENCE_DIR="$EDITOR_EVIDENCE" node tests/Browser/run-onboarding-editor-browser-tests.mjs
          touch "$EDITOR_EVIDENCE/stop"
          test "$(docker wait ather-career-ci-editor)" = 0
          docker logs ather-career-ci-editor

      - name: Sign-up invitation browser checks
        run: |
          APP_ENV=test ATHERCAR_TEST_MODE=1 \
            ATHERCAR_PLAYWRIGHT_MODULE="$RUNNER_TEMP/ather-editor-tools/node_modules/playwright" \
            ATHERCAR_SIGNUP_IMAGE="$PORTFOLIO_PRODUCTION_IMAGE" \
            ATHERCAR_SIGNUP_EVIDENCE_DIR="$RUNNER_TEMP/ather-signup-evidence" \
            node tests/Browser/run-signup-browser-tests.mjs

      - name: Private final-profile controls browser checks
        run: |
          set -euo pipefail
          HOST_RUNNER_UID=$(id -u)
          HOST_RUNNER_GID=$(id -g)
          test "$HOST_RUNNER_UID" -ne 0
          EDITOR_DB_USER="editor_$(openssl rand -hex 8)"
          EDITOR_DB_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$EDITOR_DB_PASSWORD"
          EDITOR_EVIDENCE="$RUNNER_TEMP/ather-final-profile-evidence"
          mkdir -m 0700 "$EDITOR_EVIDENCE"
          PROFILE_FIXTURE_STARTED=0
          cleanup_profile() {
            local browser_status=$? cleanup_status=0 wait_status=0 timed_out=0
            local fixture_exit='' fixture_state='' fixture_logs=''
            trap - EXIT
            set +e
            touch "$EDITOR_EVIDENCE/stop-profile" || cleanup_status=1
            if docker inspect ather-career-ci-profile-fields >/dev/null 2>&1; then
              fixture_exit=$(timeout 45s docker wait ather-career-ci-profile-fields)
              wait_status=$?
              if [[ "$wait_status" = 124 ]]; then
                echo 'Profile fixture stop timed out; forced removal required; preservation unconfirmed.' >&2
                timed_out=1
                cleanup_status=1
              elif [[ "$wait_status" != 0 ]]; then
                echo 'Profile fixture wait failed; preservation unconfirmed.' >&2
                cleanup_status=1
              else
                fixture_state=$(docker inspect --format '{{.State.Running}} {{.State.ExitCode}}' ather-career-ci-profile-fields)
                if [[ "$fixture_exit" != 0 || "$fixture_state" != 'false 0' ]]; then
                  echo 'Profile fixture did not exit cleanly.' >&2
                  cleanup_status=1
                fi
              fi
              if fixture_logs=$(docker logs ather-career-ci-profile-fields 2>&1); then
                # Print only the fixture's fixed safe evidence lines, never private diagnostics.
                printf '%s\n' "$fixture_logs" | grep -E '^PASS final-profile (browser fixture private logs/data/process/session cleanup pending final snapshot|HTTP private logs and complete process/session/file/database fixture cleanup)$' || true
                if ! printf '%s\n' "$fixture_logs" | grep -Fx 'PASS final-profile HTTP private logs and complete process/session/file/database fixture cleanup' >/dev/null; then
                  echo 'Profile fixture preservation/cleanup evidence missing.' >&2
                  cleanup_status=1
                fi
              else
                echo 'Profile fixture logs unavailable; preservation unconfirmed.' >&2
                cleanup_status=1
              fi
              if [[ "$cleanup_status" = 0 ]]; then
                echo 'PASS Profile fixture clean exit and preservation/cleanup evidence verified'
              fi
              if [[ "$timed_out" = 1 ]]; then
                docker rm -f -v ather-career-ci-profile-fields || cleanup_status=1
              else
                docker rm -v ather-career-ci-profile-fields || cleanup_status=1
              fi
            elif [[ "$PROFILE_FIXTURE_STARTED" = 1 ]]; then
              echo 'Profile fixture container missing before exit/evidence verification.' >&2
              cleanup_status=1
            fi
            if [[ "$EDITOR_DB_USER" =~ ^editor_[a-f0-9]{16}$ ]]; then
              docker exec ather-career-ci-db-1 mysql --defaults-extra-file=/tmp/ather-career-ci-mysql.cnf -e "DROP USER IF EXISTS '$EDITOR_DB_USER'@'%';" || cleanup_status=1
            else
