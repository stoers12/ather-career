<IfModule mod_headers.c>
    Header always set X-Frame-Options "DENY"
    Header always set Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; media-src 'self'"
    Header always set X-Content-Type-Options "nosniff"
    SetEnvIf Request_URI "^/owner_oidc_callback\.php$" ather_oidc_callback
    Header always set Referrer-Policy "strict-origin-when-cross-origin" env=!ather_oidc_callback
    Header always set Referrer-Policy "no-referrer" env=ather_oidc_callback
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    # Apache owns the response correlation identifier, including errors that
    # never reach PHP (for example LimitRequestBody rejections). PHP consumes
    # the same mod_unique_id value for structured application logs.
    <IfModule unique_id_module>
        Header always set X-Request-ID "%{UNIQUE_ID}e"
    </IfModule>
    # PHP owns response-specific cache directives.  This is only the safe
    # fallback for Apache-generated error responses that never reach PHP.
    Header always set Cache-Control "no-store" "expr=%{REQUEST_STATUS} >= 400 && resp('Cache-Control') == ''"
</IfModule>
