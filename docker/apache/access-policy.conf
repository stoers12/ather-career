ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Every image serves only /var/www/public (docs/RUNTIME_TOPOLOGY.md), so the
# repository internals below are unreachable by construction. These rules are
# defense in depth should an internal path ever be copied into the document root.

# Deliberately allow a future ACME-style .well-known path while denying other dotfiles.
<LocationMatch "^/(?!\.well-known(?:/|$))\.">
    Require all denied
</LocationMatch>

# /tests is absent from images; the required gates alone mount a test-only
# fixture alias there (tests/Support/apache-gate-fixtures.conf).
<LocationMatch "^/(?:database|includes|src|config|classes|docker|public|runtime|scripts|docs|vendor|contracts|data)(?:/|$)">
    Require all denied
</LocationMatch>

<LocationMatch "^/(?:Dockerfile(?:\.production)?|docker-compose(?:\.[A-Za-z0-9_-]+)?\.ya?ml|composer\.(?:json|lock)|phpstan(?:-baseline)?\.neon(?:\.dist)?|phpunit\.xml(?:\.dist)?)$">
    Require all denied
</LocationMatch>

<LocationMatch "^/.*\.(?:sql|log)$">
    Require all denied
</LocationMatch>

<LocationMatch "^/(?:.*-result\.html|login-result\.txt|photo-debug\.txt)$">
    Require all denied
</LocationMatch>

# Legacy upload URLs are retired; tenant media is served only by application handlers.
<LocationMatch "(?i)^/uploads(?:/|$)">
    Require all denied
</LocationMatch>
