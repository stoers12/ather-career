ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Keep development's repository-root mount usable without making internal files HTTP resources.
# Production has a separate document root, so these rules are defense in depth there.
<Directory "/var/www/html/uploads">
    Options -Indexes -ExecCGI
    AllowOverride None
</Directory>

# Deliberately allow a future ACME-style .well-known path while denying other dotfiles.
<LocationMatch "^/(?!\.well-known(?:/|$))\.">
    Require all denied
</LocationMatch>

<LocationMatch "^/(?:database|includes|config|classes|docker|public|runtime)(?:/|$)">
    Require all denied
</LocationMatch>

<LocationMatch "^/(?:Dockerfile(?:\.production)?|docker-compose(?:\.[A-Za-z0-9_-]+)?\.ya?ml)$">
    Require all denied
</LocationMatch>

<LocationMatch "^/.*\.(?:sql|log)$">
    Require all denied
</LocationMatch>

<LocationMatch "^/(?:.*-result\.html|login-result\.txt|photo-debug\.txt)$">
    Require all denied
</LocationMatch>

# Legacy upload URLs are retired; tenant media is served only by application handlers.
<LocationMatch "(?i)^/uploads(?:/|$)">
    Require all denied
</LocationMatch>
