<VirtualHost *:80>
    DocumentRoot /var/www/public
    DirectoryIndex index.php
    LimitRequestBody 16777216
    SetEnvIf Request_URI "^/health\.php$" ather_health_probe
    CustomLog ${APACHE_LOG_DIR}/access.log ather_safe env=!ather_health_probe

    <Directory "/var/www/public">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        LimitRequestBody 16777216

        # Single front controller (ENG-09): files that exist (assets, index.php,
        # health.php, ready.php) are served directly; every other request goes
        # to index.php, which routes it through config/routes.php. Per-directory
        # rewriting is used instead of FallbackResource because the PHP
        # SetHandler would otherwise answer missing *.php URLs with 404.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [END]
    </Directory>
</VirtualHost>
