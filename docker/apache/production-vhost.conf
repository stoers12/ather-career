<VirtualHost *:80>
    DocumentRoot /var/www/public
    DirectoryIndex index.php
    CustomLog ${APACHE_LOG_DIR}/access.log ather_safe

    <Directory "/var/www/public">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteRule ^/p/([a-z0-9][a-z0-9-]{1,62}[a-z0-9])/media/profile/?$ /p_media.php?slug=$1&type=profile [END,NE]
    RewriteRule ^/p/([a-z0-9][a-z0-9-]{1,62}[a-z0-9])/media/project/([1-9][0-9]*)/?$ /p_media.php?slug=$1&type=project&id=$2 [END,NE]
    RewriteRule ^/p/([a-z0-9][a-z0-9-]{1,62}[a-z0-9])/projects\.json$ /p_projects.php?slug=$1 [END,NE]
    RewriteRule ^/p/([a-z0-9][a-z0-9-]{1,62}[a-z0-9])/contact/?$ /p_contact.php?slug=$1 [END,NE]
    RewriteRule ^/p/([a-z0-9][a-z0-9-]{1,62}[a-z0-9])/?$ /p.php?slug=$1 [END,NE]

</VirtualHost>
