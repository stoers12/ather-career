<VirtualHost *:80>
    DocumentRoot /var/www/public
    DirectoryIndex index.php

    <Directory "/var/www/public">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteRule ^/p/([a-z0-9][a-z0-9-]{1,62}[a-z0-9])/projects\.json$ /p_projects.php?slug=$1 [END,NE]
    RewriteRule ^/p/([a-z0-9][a-z0-9-]{1,62}[a-z0-9])/?$ /p.php?slug=$1 [END,NE]

    # Application code remains outside the document root. Only managed image uploads
    # are explicitly mapped into the public URL space.
    Alias /uploads/ /var/www/app/uploads/
    <Directory "/var/www/app/uploads">
        Options -Indexes -ExecCGI +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
