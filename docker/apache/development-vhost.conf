<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html
    LimitRequestBody 16777216

    ErrorLog ${APACHE_LOG_DIR}/error.log
    SetEnvIf Request_URI "^/(?:public/)?health\.php$" ather_health_probe
    CustomLog ${APACHE_LOG_DIR}/access.log ather_safe env=!ather_health_probe

    <Directory "/var/www/html">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteRule ^/owner/evidence-hub/?$ /owner_evidence_hub.php [END,NE]
    RewriteRule ^/owner/projects/[1-9][0-9]*/evidence/?$ /owner_project_evidence.php [END,NE]
    RewriteRule ^/p/([a-z0-9][a-z0-9-]{1,62}[a-z0-9])/media/profile/?$ /public_media.php?slug=$1&type=profile [END,NE]
    RewriteRule ^/p/([a-z0-9][a-z0-9-]{1,62}[a-z0-9])/media/project/([1-9][0-9]*)/?$ /public_media.php?slug=$1&type=project&id=$2 [END,NE]
    RewriteRule ^/p/([a-z0-9][a-z0-9-]{1,62}[a-z0-9])/projects\.json$ /public_projects_json.php?slug=$1 [END,NE]
    RewriteRule ^/p/([a-z0-9][a-z0-9-]{1,62}[a-z0-9])/contact/?$ /public_contact.php?slug=$1 [END,NE]
    RewriteRule ^/p/([a-z0-9][a-z0-9-]{1,62}[a-z0-9])/?$ /public_portfolio.php?slug=$1 [END,NE]
</VirtualHost>
