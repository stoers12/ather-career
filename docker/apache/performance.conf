# Worker-pool tuning for the prefork MPM, measured with scripts/ops/run-load-test.ps1
# (see docs/LOAD_TESTING.md for the before/after numbers).
#
# Prefork holds one worker per open connection. With the 5s default an idle
# keep-alive connection blocked a worker long after its response, so workers
# ran out while the CPU stayed idle. One second keeps reuse for a page's own
# asset requests and releases the worker soon after.
KeepAliveTimeout 1

# The default 5 idle workers made a single page view (page + parallel assets)
# wait a full second for new workers. Each extra idle worker costs under 1 MiB
# of the 512 MiB container limit.
<IfModule mpm_prefork_module>
    StartServers 15
    MinSpareServers 15
    MaxSpareServers 30
</IfModule>
