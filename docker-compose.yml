name: portfolio_course

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8088:80"
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    volumes:
      - .:/var/www/html
      - portfolio_private_storage:/var/www/private-storage
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_ENV: ${APP_ENV:-development}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL must be configured}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE}
      EXPECTED_OIDC_ISSUER: ${EXPECTED_OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI}
      ATHERCAR_STORAGE_ROOT: /var/www/private-storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$body = @file_get_contents(\"http://127.0.0.1/public/health.php\"); exit($$body === \"OK\\n\" ? 0 : 1);'"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s

  db:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3308:3306"
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - portfolio_db_data:/var/lib/mysql
      - ./database/portfolio_db.sql:/docker-entrypoint-initdb.d/01-portfolio.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping -h localhost -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    stop_grace_period: 60s

volumes:
  portfolio_db_data:
  portfolio_private_storage:
